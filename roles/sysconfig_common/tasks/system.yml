- name: Check the supported distribution family
  ansible.builtin.assert:
    that: ansible_facts.os_family in ['Debian', 'Archlinux']
    fail_msg: This role supports Debian/Ubuntu and Arch Linux.

- name: Install Debian and Ubuntu packages
  become: true
  ansible.builtin.apt:
    name: [git, curl, fish, neovim, tmux, tealdeer]
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts.os_family == 'Debian'

- name: Inspect installed Arch Linux packages
  ansible.builtin.package_facts:
    manager: pacman
  when: ansible_facts.os_family == 'Archlinux'

- name: Install Arch Linux packages
  become: true
  community.general.pacman:
    name: "{{ sysconfig_arch_packages }}"
    state: present
    update_cache: true
  when:
    - ansible_facts.os_family == 'Archlinux'
    - sysconfig_arch_packages | difference(ansible_facts.packages.keys() | list) | length > 0

- name: Select Neovim for Debian editor alternatives
  become: true
  community.general.alternatives:
    name: "{{ item }}"
    link: "/usr/bin/{{ item }}"
    path: /usr/bin/nvim
    priority: 60
    state: selected
  loop: [vi, vim]
  when: ansible_facts.os_family == 'Debian'

- name: Inspect existing editor commands
  ansible.builtin.stat:
    path: "/usr/bin/{{ item }}"
    follow: false
  loop: [vim, edit, ex, vedit, vi, view]
  register: sysconfig_editor_commands

- name: Link missing editor commands to Neovim
  become: true
  ansible.builtin.file:
    src: nvim
    dest: "/usr/bin/{{ item.item }}"
    state: link
  loop: "{{ sysconfig_editor_commands.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not item.stat.exists

- name: Set the user's login shell to Fish
  become: true
  ansible.builtin.user:
    name: "{{ sysconfig_user }}"
    shell: /usr/bin/fish
