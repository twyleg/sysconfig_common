- name: Look up the target user
  ansible.builtin.getent:
    database: passwd
    key: "{{ sysconfig_user }}"

- name: Configure system packages and editor commands
  ansible.builtin.import_tasks: system.yml
  when: sysconfig_manage_system | bool
  tags:
    - system

- name: Configure the user's environment
  become: "{{ sysconfig_user != ansible_facts.user_id }}"
  become_user: "{{ sysconfig_user }}"
  block:
    - name: Install the configuration files and links
      ansible.builtin.import_tasks: config.yml

    - name: Install Vim plugins
      ansible.builtin.import_tasks: plugins.yml
      when: sysconfig_install_plugins | bool
  tags:
    - config
