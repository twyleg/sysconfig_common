sysconfig_user: "{{ ansible_user | default(ansible_facts.user_id) }}"
sysconfig_home: "{{ getent_passwd[sysconfig_user][4] }}"
sysconfig_source_dir: "{{ sysconfig_home }}/dev/sysconfig_common"
sysconfig_data_home: "{{ ansible_facts.env.XDG_DATA_HOME | default(sysconfig_home + '/.local/share', true) }}"
sysconfig_manage_system: true
sysconfig_install_plugins: true
sysconfig_plugin_base_url: https://github.com
sysconfig_vim_plug_url: https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim
sysconfig_arch_packages:
  - git
  - curl
  - fish
  - neovim
  - tmux
  - tldr
